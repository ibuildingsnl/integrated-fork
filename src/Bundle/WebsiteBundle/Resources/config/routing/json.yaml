integrated_website_search_selection_json:
  path: '/content/json/{id}'
  methods: ['GET']
  defaults:
    _controller: 'Integrated\Bundle\WebsiteBundle\Controller\JSONController::searchSelectionJson'
    _format: 'json'
integrated_website_related_content_block_json:
  path: '/related_content_block/json'
  methods: ['GET']
  defaults:
    _controller: 'Integrated\Bundle\WebsiteBundle\Controller\JSONController::relatedContentBlock'
    _format: 'json'
