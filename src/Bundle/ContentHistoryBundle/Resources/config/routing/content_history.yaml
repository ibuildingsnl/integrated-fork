integrated_content_history_index:
  path: '/{id}'
  methods: ['GET']
  defaults:
    _controller: 'Integrated\Bundle\ContentHistoryBundle\Controller\ContentHistoryController::index'
integrated_content_history_show:
  path: '/{id}/show'
  methods: ['GET']
  defaults:
    _controller: 'Integrated\Bundle\ContentHistoryBundle\Controller\ContentHistoryController::show'
integrated_content_history_index_iframe:
  path: '/{id}/iframe'
  methods: ['GET']
  defaults:
    _controller: 'Integrated\Bundle\ContentHistoryBundle\Controller\ContentHistoryController::indexIframe'
integrated_content_history_show_iframe:
  path: '/{id}/show/iframe'
  methods: ['GET']
  defaults:
    _controller: 'Integrated\Bundle\ContentHistoryBundle\Controller\ContentHistoryController::showIframe'
